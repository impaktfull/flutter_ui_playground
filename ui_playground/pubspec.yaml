name: ui_playground
description: "A Flutter package that provides an interactive playground for testing and showcasing UI components."
version: 0.0.8
homepage: https://github.com/impaktfull/flutter_ui_playground

environment:
  sdk: ^3.10.1
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  impaktfull_ui: ^0.79.1
  phosphoricons_flutter: ^1.1.1
  ui_playground_annotations: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  ui_playground_annotations:
    path: ../ui_playground_annotations

flutter:
