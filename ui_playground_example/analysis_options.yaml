include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: ignore
  exclude:
    - "**.g.dart"
    - "**.config.dart"
    - "**.navigator.dart"
    # - "**.ui_playground.dart"
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  trailing_commas: preserve

linter:
  rules:
    - unawaited_futures
